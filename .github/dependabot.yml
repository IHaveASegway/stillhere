# Dependabot keeps every pin in this repository current: the actions that
# the workflows pin to full commit SHAs, the Go modules in go.mod, and the
# base image digest in the Dockerfile. A pin that nobody updates becomes a
# known vulnerability, so pinning and updating come together.
#
# A seven-day cooldown lets a release age before it is proposed: most
# malicious releases of a hijacked package are caught and pulled within
# days. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
