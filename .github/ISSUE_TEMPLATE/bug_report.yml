name: Bug report
description: stillhere crashed, printed a wrong number, or did not do what its docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A security problem, such as a token that reaches output or a repository that makes stillhere run a program, goes to a [private security advisory](https://github.com/IHaveASegway/stillhere/security/advisories/new) instead (see SECURITY.md).

        Issues are public: please replace real people's names, emails, repository names and any token with placeholders before pasting output.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and what it printed. For a wrong number, which number and why you believe it is wrong.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the docs, or the metric definition in docs/metrics.md, say should happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest history that shows it is best, such as a script of git commands that builds a throwaway repository.
      render: shell
  - type: textarea
    id: version
    attributes:
      label: stillhere version
      description: The output of `stillhere version`.
      render: text
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: git version
      description: The output of `git version`. stillhere needs 2.45 or newer.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed stillhere
      options:
        - Homebrew
        - Docker image
        - go install
        - Release archive
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 27, Ubuntu 24.04, Windows 11, ...
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I replaced real names, emails, repository names and tokens with placeholders.
          required: true
